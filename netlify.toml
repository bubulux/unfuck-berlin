# Build-Command MUSS `npm run build` sein, damit der prebuild-Hook
# (scripts/fetch-content.mjs) läuft und die Inhalte frisch aus Sanity zieht.
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "https://unfuck-berlin.com/*"
  to   = "https://unfuck.berlin/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "https://www.unfuck-berlin.com/*"
  to   = "https://unfuck.berlin/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "https://unfuck-berlin.de/*"
  to   = "https://unfuck.berlin/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "https://unfuck-berlin.org/*"
  to   = "https://unfuck.berlin/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "https://unfuckberlin.com/*"
  to   = "https://unfuck.berlin/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "https://unfuckberlin.eu/*"
  to   = "https://unfuck.berlin/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "https://unfuckberlin.org/*"
  to   = "https://unfuck.berlin/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "https://unfuckberlin.de/*"
  to   = "https://unfuck.berlin/:splat"
  status = 301
  force  = true

# Calendar proxy: fetch the public Volt Berlin Google Calendar ICS server-side
# and serve it same-origin, so the browser fetch isn't CORS-blocked.
[[redirects]]
  from = "/api/volt-calendar"
  to   = "https://calendar.google.com/calendar/ical/volteuropa.org_3qtptk1l0mfg76gq9nfqq1h4mg%40group.calendar.google.com/public/basic.ics"
  status = 200
  force  = true

# SPA fallback: serve the app shell for client-side routes (e.g. /confirm?token=…).
# Existing static files (e.g. /sticker/confirm.html) are served before this rule.
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
