<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nervkrams teilen – unf*ck berlin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <div class="content-wrapper">
      <div id="view-nervkrams">
        <a href="index.html"><img src="assets/logo.png" class="logo" alt="unf*ck berlin 0926" /></a>
        <form id="nervkramsForm" novalidate>
          <label class="file-drop-area" for="fileInput">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="file-icon"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
            <span class="file-text">Fotos hochladen</span>
            <span class="file-hint">Max. 10 MB gesamt</span>
            <input type="file" id="fileInput" accept="image/*" multiple hidden />
          </label>
          <ul id="fileList" class="file-list"></ul>
          <input type="text" id="problem" placeholder="Was nervt dich?" required />
          <input type="text" id="ort" placeholder="Wo nervt es dich?" required />
          <input type="email" id="kontakt" placeholder="Deine E-Mail-Adresse" />
          <div id="nervkramsError" class="error-msg" hidden></div>
          <button type="submit"><span class="btn-label">Absenden</span></button>
        </form>
        <div id="successNervkrams" class="success-state" hidden>
          <div class="success-icon">✓</div>
          <h2>Danke!</h2>
          <p>Wir haben deinen Nervkrams erhalten.</p>
        </div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast" role="alert" aria-live="assertive"></div>

  <footer>
    <a href="https://voltdeutschland.org/berlin/impressum" target="_blank" rel="noopener">Impressum</a>
    <a href="https://voltdeutschland.org/datenschutz" target="_blank" rel="noopener">Datenschutz</a>
    <a href="https://voltdeutschland.org/berlin/transparenz" target="_blank" rel="noopener">Transparenz</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://ugxzkzydoajexjgwcqtq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVneHprenlkb2FqZXhqZ3djcXRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNTM5MTksImV4cCI6MjA5NTgyOTkxOX0.pgO_pJ0ksQiGp5mYiLtz6E8uxD78MmWbXrufJA669_U';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const nervkramsForm = document.getElementById('nervkramsForm');
    const nervkramsError = document.getElementById('nervkramsError');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const MAX_BYTES = 10 * 1024 * 1024; // 10 MB
    const MAX_FILES = 10;

    const toast = document.getElementById('toast');
    let toastTimer;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 4000);
    }

    let selectedFiles = [];

    function totalSize() {
      return selectedFiles.reduce((sum, f) => sum + f.size, 0);
    }

    fileInput.addEventListener('change', () => {
      nervkramsError.hidden = true;
      let limitToastShown = false;
      for (const file of fileInput.files) {
        if (selectedFiles.some(f => f.name === file.name && f.size === file.size)) continue;
        if (!file.type.startsWith('image/')) {
          showToast(`Nur Fotos erlaubt – "${file.name}" wurde nicht hinzugefügt.`);
          continue;
        }
        if (selectedFiles.length >= MAX_FILES) {
          if (!limitToastShown) {
            showToast(`Maximal ${MAX_FILES} Fotos erlaubt.`);
            limitToastShown = true;
          }
          continue;
        }
        if (totalSize() + file.size > MAX_BYTES) {
          showToast(`Gesamtgröße überschreitet 10 MB – "${file.name}" wurde nicht hinzugefügt.`);
          continue;
        }
        selectedFiles.push(file);
      }
      fileInput.value = '';
      renderFileList();
    });

    function renderFileList() {
      fileList.innerHTML = '';
      selectedFiles.forEach((file, i) => {
        const li = document.createElement('li');
        li.className = 'file-list-item';
        const span = document.createElement('span');
        span.className = 'file-name';
        span.textContent = file.name;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'file-remove';
        btn.setAttribute('aria-label', 'Datei entfernen');
        btn.textContent = '✕';
        btn.addEventListener('click', () => {
          selectedFiles.splice(i, 1);
          renderFileList();
        });
        li.append(span, btn);
        fileList.appendChild(li);
      });
    }

    nervkramsForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      nervkramsError.hidden = true;

      const problem = document.getElementById('problem').value.trim();
      const ort = document.getElementById('ort').value.trim();
      const kontakt = document.getElementById('kontakt').value.trim();

      if (!problem || !ort) {
        nervkramsError.textContent = 'Bitte fülle die Pflichtfelder aus.';
        nervkramsError.hidden = false;
        return;
      }

      const submitBtn = nervkramsForm.querySelector('button[type="submit"]');
      const submitLabel = submitBtn.querySelector('.btn-label');
      const originalLabel = submitLabel.textContent;
      submitBtn.disabled = true;
      submitBtn.setAttribute('aria-busy', 'true');
      submitLabel.textContent = selectedFiles.length ? 'Lädt hoch …' : 'Wird gesendet …';

      try {
        const fileUrls = [];
        if (selectedFiles.length) {
          const stamp = Date.now();
          for (let i = 0; i < selectedFiles.length; i++) {
            const file = selectedFiles[i];
            const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
            const path = `${stamp}-${i}-${safeName}`;
            const { error: uploadError } = await supabaseClient
              .storage
              .from('nervkrams-uploads')
              .upload(path, file, { cacheControl: '3600', upsert: false });
            if (uploadError) {
              showToast('Datei-Upload fehlgeschlagen. Versuch es nochmal.');
              return;
            }
            const { data } = supabaseClient.storage.from('nervkrams-uploads').getPublicUrl(path);
            fileUrls.push(data.publicUrl);
          }
          submitLabel.textContent = 'Wird gesendet …';
        }

        const { error } = await supabaseClient
          .from('nervkrams_reports')
          .insert({ problem, ort, kontakt: kontakt || null, file_urls: fileUrls.length ? fileUrls : null });

        if (error) {
          showToast('Etwas ist schiefgelaufen. Versuch es nochmal.');
          return;
        }

        nervkramsForm.hidden = true;
        document.getElementById('successNervkrams').hidden = false;
      } catch (err) {
        showToast('Netzwerkfehler. Bitte prüf deine Verbindung und versuch es nochmal.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.removeAttribute('aria-busy');
        submitLabel.textContent = originalLabel;
      }
    });
  </script>
</body>
</html>
