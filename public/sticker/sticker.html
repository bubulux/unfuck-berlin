<!DOCTYPE html>
<html lang="de">
<head>
  <!-- Google tag (gtag.js) -->

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sticker abgreifen – unf*ck berlin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <div class="content-wrapper">
      <div id="view-sticker">
        <a href="/" target="_top"><img src="assets/logo.png" class="logo" alt="unf*ck berlin 0926" /></a>
        <p class="tagline" id="stickerTagline">10 unfuck Sticker gratis für dich.</p>
        <form id="stickerForm" novalidate>
          <input type="email" id="email" placeholder="E-Mail" autocomplete="email" required />
          <input type="text" id="name" placeholder="Vor & Nachname" autocomplete="name" required />
          <input type="text" id="strasse" placeholder="Straße & Hausnummer" autocomplete="address-line1" required />
          <div class="row">
            <input type="text" id="plz" placeholder="PLZ" class="plz" autocomplete="postal-code" inputmode="numeric" maxlength="5" required />
            <input type="text" id="stadt" placeholder="Stadt" class="stadt" autocomplete="address-level2" required />
          </div>
          <label class="checkbox-label">
            <input type="checkbox" id="consent" required />
            <span>Ich akzeptiere die <a href="https://voltdeutschland.org/datenschutz" class="inline-link" target="_blank" rel="noopener" onclick="event.stopPropagation()">Datenschutzerklärung</a> von Volt Deutschland.</span>
          </label>
          <div id="errorMsg" class="error-msg" hidden></div>
          <button type="submit"><span class="btn-label">STICKER ABGREIFEN</span></button>
        </form>
        <div id="successSticker" class="success-state" hidden>
          <div class="success-icon">✓</div>
          <h2>Danke!</h2>
          <p>Bitte bestätige deine Bestellung per E-Mail!</p>
          <p class="follow-heading">Folge uns für mehr auf</p>
          <div class="social-row">
            <a href="https://www.facebook.com/BerlinVolt/?locale=de_DE" target="_blank" rel="noopener" aria-label="Facebook"><img src="logosSM/facebook.svg" alt="Facebook" /></a>
            <a href="https://www.instagram.com/volt_berlin/" target="_blank" rel="noopener" aria-label="Instagram"><img src="logosSM/insta.svg" alt="Instagram" /></a>
            <a href="https://twitter.com/volt_berlin" target="_blank" rel="noopener" aria-label="Twitter"><img src="logosSM/twitter.svg" alt="Twitter" /></a>
            <a href="https://www.youtube.com/@volt_berlin/" target="_blank" rel="noopener" aria-label="YouTube"><img src="logosSM/youtube.svg" alt="YouTube" /></a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast" role="alert" aria-live="assertive"></div>

  <footer>
    <a href="https://voltdeutschland.org/berlin/impressum" target="_blank" rel="noopener">Impressum</a>
    <a href="https://voltdeutschland.org/datenschutz" target="_blank" rel="noopener">Datenschutz</a>
    <a href="https://voltdeutschland.org/berlin/transparenz" target="_blank" rel="noopener">Transparenz</a>
  </footer>

  <script>
    const SUPABASE_URL = 'https://ugxzkzydoajexjgwcqtq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVneHprenlkb2FqZXhqZ3djcXRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNTM5MTksImV4cCI6MjA5NTgyOTkxOX0.pgO_pJ0ksQiGp5mYiLtz6E8uxD78MmWbXrufJA669_U';
    const SUBMIT_URL = `${SUPABASE_URL}/functions/v1/sticker-submit`;

    const stickerForm = document.getElementById('stickerForm');
    const errorMsg = document.getElementById('errorMsg');

    const toast = document.getElementById('toast');
    let toastTimer;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 4000);
    }

    stickerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.hidden = true;

      const email = document.getElementById('email').value.trim();
      const name = document.getElementById('name').value.trim();
      const strasse = document.getElementById('strasse').value.trim();
      const plz = document.getElementById('plz').value.trim();
      const stadt = document.getElementById('stadt').value.trim();
      const consent = document.getElementById('consent').checked;

      if (!email || !name || !strasse || !plz || !stadt) {
        errorMsg.textContent = 'Bitte fülle alle Felder aus.';
        errorMsg.hidden = false;
        return;
      }
      if (!consent) {
        errorMsg.textContent = 'Bitte stimme der Datenschutzerklärung zu.';
        errorMsg.hidden = false;
        return;
      }

      const submitBtn = stickerForm.querySelector('button[type="submit"]');
      const submitLabel = submitBtn.querySelector('.btn-label');
      const originalLabel = submitLabel.textContent;
      submitBtn.disabled = true;
      submitBtn.setAttribute('aria-busy', 'true');
      submitLabel.textContent = 'Wird gesendet …';

      try {
        const res = await fetch(SUBMIT_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          },
          body: JSON.stringify({ email, name, strasse, plz, stadt, consent }),
        });

        if (res.status === 409) {
          errorMsg.textContent = 'Diese E-Mail-Adresse hat bereits Sticker angefordert. Schau in dein Postfach.';
          errorMsg.hidden = false;
          return;
        }

        if (!res.ok) {
          showToast('Etwas ist schiefgelaufen. Versuch es nochmal.');
          return;
        }

        document.getElementById('stickerTagline').hidden = true;
        stickerForm.hidden = true;
        document.getElementById('successSticker').hidden = false;
      } catch (err) {
        showToast('Netzwerkfehler. Bitte prüf deine Verbindung und versuch es nochmal.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.removeAttribute('aria-busy');
        submitLabel.textContent = originalLabel;
      }
    });
  </script>
</body>
</html>
